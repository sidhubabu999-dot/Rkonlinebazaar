<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RK Online Bazaar - Registration</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
}

.container {
  max-width: 450px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 3px 15px #0002;
}

h2 {
  text-align: center;
  color: #087443;
}

p {
  text-align: center;
  color: #555;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border: none;
  border-radius: 8px;
  background: #087443;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

.shopButton {
  background: #e88718;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 15px;
}

.form {
  display: none;
  margin-top: 20px;
}

.back {
  background: #555;
}

#message {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h2>RK Online Bazaar</h2>

<p>आपके शहर की खरीदारी ऑनलाइन</p>

<p>अपने जिले की दुकानों से रोजाना का सामान आसानी से खोजें।</p>

<h3>आप कौन हैं?</h3>

<button onclick="showForm('customer')">
Customer Registration / ग्राहक
</button>

<button class="shopButton" onclick="showForm('shopkeeper')">
Shopkeeper Registration / दुकानदार
</button>


<!-- CUSTOMER FORM -->

<div id="customerForm" class="form">

<h2>ग्राहक रजिस्ट्रेशन</h2>

<form onsubmit="registerUser(event, 'customer')">

<input id="cname" type="text"
placeholder="आपका नाम" required>

<input id="cphone" type="tel"
placeholder="मोबाइल नंबर" required>

<input id="cemail" type="email"
placeholder="ईमेल" required>

<input id="cpassword" type="password"
placeholder="पासवर्ड" required minlength="6">

<button type="submit">ग्राहक रजिस्टर करें</button>

</form>

<button class="back" onclick="goBack()">वापस जाएँ</button>

</div>


<!-- SHOPKEEPER FORM -->

<div id="shopkeeperForm" class="form">

<h2>दुकानदार रजिस्ट्रेशन</h2>

<form onsubmit="registerUser(event, 'shopkeeper')">

<input id="shopname" type="text"
placeholder="दुकान का नाम" required>

<input id="ownername" type="text"
placeholder="मालिक का नाम" required>

<input id="sphone" type="tel"
placeholder="मोबाइल नंबर" required>

<input id="whatsapp" type="tel"
placeholder="WhatsApp नंबर" required>

<input id="semail" type="email"
placeholder="ईमेल" required>

<input id="spassword" type="password"
placeholder="पासवर्ड" required minlength="6">

<button type="submit">दुकानदार रजिस्टर करें</button>

</form>

<button class="back" onclick="goBack()">वापस जाएँ</button>

</div>

<div id="message"></div>

</div>


<script>

// अपना Supabase Project URL और Publishable Key यहाँ डालें

const SUPABASE_URL = https://njlhsxbdvbjappwumixd.supabase.co
const SUPABASE_ANON_KEY = sb_publishable_3Bo5Qc6cgHCLR068BGMmig_pC0IM43n

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


function showForm(type) {

  document.getElementById("customerForm").style.display = "none";
  document.getElementById("shopkeeperForm").style.display = "none";

  document.getElementById("message").innerText = "";

  if (type === "customer") {
    document.getElementById("customerForm").style.display = "block";
  } else {
    document.getElementById("shopkeeperForm").style.display = "block";
  }
}


function goBack() {

  document.getElementById("customerForm").style.display = "none";
  document.getElementById("shopkeeperForm").style.display = "none";

  document.getElementById("message").innerText = "";
}


async function registerUser(event, role) {

  event.preventDefault();

  const message = document.getElementById("message");

  let name, phone, email, password, extraData = {};

  if (role === "customer") {

    name = document.getElementById("cname").value.trim();
    phone = document.getElementById("cphone").value.trim();
    email = document.getElementById("cemail").value.trim();
    password = document.getElementById("cpassword").value;

  } else {

    name = document.getElementById("ownername").value.trim();
    phone = document.getElementById("sphone").value.trim();
    email = document.getElementById("semail").value.trim();
    password = document.getElementById("spassword").value;

    extraData = {
      shop_name: document.getElementById("shopname").value.trim(),
      whatsapp: document.getElementById("whatsapp").value.trim()
    };
  }

  message.style.color = "blue";
  message.innerText = "रजिस्ट्रेशन हो रहा है...";

  const { data, error } = await supabaseClient.auth.signUp({

    email: email,
    password: password,

    options: {
      data: {
        name: name,
        phone: phone,
        role: role,
        ...extraData
      }
    }

  });

  if (error) {

    message.style.color = "red";
    message.innerText = error.message;

  } else {

    message.style.color = "green";

    if (data.session) {
      message.innerText = "रजिस्ट्रेशन सफल हुआ!";
    } else {
      message.innerText =
        "रजिस्ट्रेशन हो गया! कृपया अपना ईमेल चेक करके अकाउंट वेरिफाई करें।";
    }

    event.target.reset();
  }

}

</script>

</body>
</html>
